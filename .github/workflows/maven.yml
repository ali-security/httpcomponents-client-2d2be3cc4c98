name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        # windows-latest is not used due to intermittent network failures
        os: [ubuntu-latest, macos-latest]
        # All LTS versions plus the current version
        java: [ 8, 11, 17 ]
        experimental: [false]
#        include:
#          - java: 20-ea
#            os: ubuntu-latest
#            experimental: true        
#          - java: 20-ea
#            os: windows-latest
#            experimental: true        
#          - java: 20-ea
#            os: macos-latest
#            experimental: true        
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v3
    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v3
      with:
        # Temurin ships no arm64-macOS JDK 8; Zulu does
        distribution: ${{ (matrix.os == 'macos-latest' && matrix.java == 8) && 'zulu' || 'temurin' }}
        java-version: ${{ matrix.java }}
    - name: Build with Maven
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -P-use-toolchains -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
        else
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -P-use-toolchains
        fi
    - name: Report skipped tests
      if: always()
      shell: bash
      run: |
        python3 - <<'PY'
        import glob, xml.etree.ElementTree as ET
        total = 0
        for f in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
            for tc in ET.parse(f).getroot().iter('testcase'):
                sk = tc.find('skipped')
                if sk is not None:
                    total += 1
                    print('SKIPPED %s#%s : %s' % (tc.get('classname'), tc.get('name'), sk.get('message') or (sk.text or '').strip() or '(no message)'))
        print('Total skipped tests: %d' % total)
        PY
    - name: Upload artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: httpclient5-jars
        path: |
          httpclient5/target/httpclient5-5.2.3.jar
          httpclient5/target/httpclient5-5.2.3-tests.jar
        if-no-files-found: error
